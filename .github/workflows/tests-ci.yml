name: tests-ci

on:
  pull_request:
    paths:
      - 'app/**'
      - 'bench/**'
      - 'docs/**/*.py'
      - 'packaging/**'
      - 'plugins/**/*.py'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**/*.py'
      - 'dupez.py'
      - 'dupez_helper.py'
      - 'dupez_single_instance.py'
      - '.github/workflows/**'
      - 'pytest.ini'
      - 'ruff.toml'
      - 'requirements.in'
      - 'requirements.txt'
      - 'requirements-locked.header'
      - 'requirements-locked.txt'
      - 'requirements-test.in'
      - 'requirements-test-locked.txt'
      - 'requirements-hardware-test.in'
      - 'requirements-hardware-test-locked.txt'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bench/**'
      - 'docs/**/*.py'
      - 'packaging/**'
      - 'plugins/**/*.py'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**/*.py'
      - 'dupez.py'
      - 'dupez_helper.py'
      - 'dupez_single_instance.py'
      - '.github/workflows/**'
      - 'pytest.ini'
      - 'ruff.toml'
      - 'requirements.in'
      - 'requirements.txt'
      - 'requirements-locked.header'
      - 'requirements-locked.txt'
      - 'requirements-test.in'
      - 'requirements-test-locked.txt'
      - 'requirements-hardware-test.in'
      - 'requirements-hardware-test-locked.txt'

permissions:
  contents: read

concurrency:
  group: tests-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --require-hashes \
            -r requirements-test-locked.txt
          python -m pip install --only-binary=:all: --require-hashes \
            -r requirements-locked.txt

      - name: Run pytest
        id: pytest
        shell: bash
        env:
          DUPEZ_OFFSEC_CONSENT: ""
          DUPEZ_SECOND_FACTOR_DISABLED: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set +e
          python -X faulthandler -m pytest tests/ -vv --maxfail=5 \
            --junitxml=pytest-${{ matrix.python-version }}.xml \
            --cov=app \
            --cov-report=term \
            --cov-fail-under=40 2>&1 | tee pytest-${{ matrix.python-version }}.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show pytest failure tail
        if: steps.pytest.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::group::Last 400 lines of pytest output"
          tail -n 400 pytest-${{ matrix.python-version }}.log || true
          echo "::endgroup::"

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-diagnostics-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail pytest job
        if: steps.pytest.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "pytest failed with exit code ${{ steps.pytest.outputs.exit_code }}"
          exit 1

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install hash-locked test tools
        shell: bash
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-test-locked.txt

      - name: Run Ruff on every tracked Python file
        shell: bash
        run: |
          mapfile -d '' python_files < <(git ls-files -z -- '*.py')
          if (( ${#python_files[@]} == 0 )); then
            echo 'No tracked Python files found.' >&2
            exit 1
          fi
          ruff check -- "${python_files[@]}"

  ast-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: AST-parse every tracked Python file
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import subprocess
          import sys
          import tokenize

          output = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.py"]
          ).decode("utf-8")
          paths = [Path(value) for value in output.split("\0") if value]
          if not paths:
              print("No tracked Python files found.", file=sys.stderr)
              sys.exit(1)

          failures = []
          for path in paths:
              try:
                  with tokenize.open(path) as source_file:
                      ast.parse(source_file.read(), filename=str(path))
              except (SyntaxError, UnicodeError) as error:
                  failures.append((path, error))

          for path, error in failures:
              print(f"SYNTAX FAIL {path}: {error}", file=sys.stderr)
          if failures:
              sys.exit(1)
          print(f"AST OK: scanned {len(paths)} tracked Python files")
          PY
